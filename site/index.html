<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffres</title>
<meta name="description" content="Compte automatiquement les coffres que tu ouvres dans Fortnite, à partir de tes replays. Tout reste sur ton PC.">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='7' fill='%23111113'/%3E%3Crect x='6' y='14' width='20' height='11' rx='2' fill='%23c8952c'/%3E%3Cpath d='M6 15a10 8 0 0 1 20 0z' fill='%23e8b04b'/%3E%3Crect x='14.5' y='15' width='3' height='4.5' rx='.8' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f5f7;--card:#fff;--card2:#f5f5f7;--text:#1d1d1f;--sub:#6e6e73;--faint:#86868b;--line:rgba(0,0,0,.08);
  --blue:#0071e3;--gold:#b7811f;--gold2:#e8b04b;--red:#ff3b30;--green:#28a745;--orange:#f56300;--track:rgba(0,0,0,.06);
  --bar:rgba(245,245,247,.75);--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.05);--scrim:rgba(0,0,0,.32);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#000;--card:#161618;--card2:#1f1f22;--text:#f5f5f7;--sub:#a1a1a6;--faint:#6e6e73;--line:rgba(255,255,255,.1);
  --blue:#2997ff;--gold:#e8b04b;--gold2:#f3c86a;--green:#30d158;--orange:#ff9f0a;--track:rgba(255,255,255,.09);--bar:rgba(0,0,0,.68);--shadow:none;--scrim:rgba(0,0,0,.6);
}}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:110px}
body{background:var(--bg);color:var(--text);font:400 1rem/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.display,h1,h2,.big,.v,.pct{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:14px;height:54px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.015em;font-size:1.06rem;flex:none}
.brand svg{width:24px;height:24px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;justify-content:center}
.tabs::-webkit-scrollbar{display:none}
.tabs a{color:var(--sub);font-size:.84rem;padding:6px 11px;border-radius:999px;white-space:nowrap;transition:color .2s,background .2s}
.tabs a:hover{color:var(--text)}
.tabs a.on{color:var(--text);background:var(--track);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;color:var(--sub);padding:5px 11px;border-radius:999px;background:var(--track);white-space:nowrap;flex:none;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.pill.live .dot,.live-dot{background:var(--red);animation:pulse 1.6s ease-in-out infinite}
.pill.busy .dot{background:var(--blue)}
.pill.ok .dot{background:var(--green)}
@keyframes pulse{50%{opacity:.3}}
.progress{height:2px;position:relative;overflow:hidden}
.progress i{position:absolute;inset:0 auto 0 0;background:var(--blue);width:0;transition:width .4s ease}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 18px;border-radius:999px;background:var(--blue);color:#fff;font-weight:500;font-size:.92rem;transition:transform .1s ease-out,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--track);color:var(--text)}
.btn.sm{height:30px;padding:0 13px;font-size:.82rem}
.btn.red{background:transparent;color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.icon-btn{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;background:var(--track);color:var(--sub);flex:none}
.icon-btn svg{width:15px;height:15px}
.page{display:none;padding-bottom:40px}
.page.on{display:block;animation:fade .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.hero{text-align:center;padding:68px 0 40px}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.big{font-size:clamp(5.5rem,19vw,10.5rem);font-weight:700;line-height:1;letter-spacing:-.045em;margin:12px 0 10px;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:14px}
.big .live-dot{width:16px;height:16px;border-radius:50%}
.lead{font-size:clamp(1.08rem,2.3vw,1.35rem);color:var(--sub);letter-spacing:-.01em}
.lead b{color:var(--text);font-weight:600}
.head{padding:52px 0 26px}
.head h1{font-size:clamp(2.3rem,5.5vw,3.3rem);font-weight:700;letter-spacing:-.035em;line-height:1.05}
.head p{color:var(--sub);font-size:1.08rem;margin-top:8px;max-width:640px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:48px}
.tiles.five{grid-template-columns:1.4fr repeat(4,minmax(0,1fr))}
.tile{background:var(--card);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);position:relative;min-width:0}
.tile .k{font-size:.8rem;color:var(--sub)}
.tile .v{font-size:2rem;font-weight:600;letter-spacing:-.03em;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .s{font-size:.78rem;color:var(--faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.tile.hl{background:linear-gradient(140deg,var(--gold),color-mix(in srgb,var(--gold) 70%,#000));color:#fff}
.tile.hl .k,.tile.hl .s{color:rgba(255,255,255,.78)}
.tile.hl .v{font-size:2.6rem}
.tile .icon-btn{position:absolute;top:12px;right:12px}
.tile.hl .icon-btn{background:rgba(255,255,255,.2);color:#fff}
section{margin-bottom:56px}
.h2row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px}
h2{font-size:clamp(1.5rem,3.2vw,2rem);font-weight:700;letter-spacing:-.025em;line-height:1.1}
h3{font-size:1.05rem;font-weight:600;letter-spacing:-.01em}
.note{font-size:.86rem;color:var(--sub)}
.h2row .note{text-align:right}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:20px 22px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.list{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 20px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.click{cursor:pointer}
.row.click:hover{background:var(--card2)}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d{font-size:.8rem;color:var(--sub);overflow:hidden;text-overflow:ellipsis}
.row .n{font-size:1.2rem;font-weight:600;letter-spacing:-.02em;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .n small{display:block;font-size:.7rem;font-weight:400;color:var(--faint);letter-spacing:0}
.row.off{opacity:.5}
.detail{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;padding:6px 0 4px;font-size:.84rem;color:var(--sub)}
.detail b{color:var(--text);font-weight:600;display:block;margin-bottom:4px;font-size:.8rem}
.detail ul{list-style:none;padding:0;display:grid;gap:2px}
.more{display:block;width:100%;padding:13px;color:var(--blue);font-size:.9rem;border-top:1px solid var(--line)}
.empty{padding:28px 20px;color:var(--sub);text-align:center}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 34% 56px;gap:12px;align-items:center;padding:9px 0;font-size:.9rem;border-top:1px solid var(--line)}
.hbar:first-child{border-top:0}
.hbar .b{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.hbar .b i{display:block;height:100%;background:var(--gold);border-radius:3px}
.hbar .c{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:170px;display:block}
.chart .axis{display:flex;justify-content:space-between;font-size:.74rem;color:var(--faint);margin-top:8px}
.banner{display:flex;gap:14px;align-items:center;border-radius:16px;padding:14px 18px;margin-bottom:12px;background:color-mix(in srgb,var(--gold2) 18%,var(--card));box-shadow:var(--shadow)}
.banner.info{background:color-mix(in srgb,var(--blue) 12%,var(--card))}
.banner .bt{font-weight:600;font-size:.95rem}
.banner .bd{font-size:.84rem;color:var(--sub)}
.banner .grow{flex:1;min-width:0}
.odds{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.odd{background:var(--card);border-radius:18px;padding:16px;display:flex;gap:14px;box-shadow:var(--shadow);min-width:0}
.thumb{width:64px;height:64px;border-radius:13px;object-fit:cover;flex:none;background:var(--card2);display:grid;place-items:center;font-size:1.6rem}
.odd .meta{flex:1;min-width:0}
.kind{font-size:.74rem;color:var(--sub);font-weight:500;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.name{font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar{height:5px;border-radius:3px;background:var(--track);margin:9px 0 6px;overflow:hidden}
.cbar i{display:block;height:100%;border-radius:3px;background:var(--faint);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.line{display:flex;justify-content:space-between;align-items:flex-end;font-size:.76rem;color:var(--faint);gap:8px}
.pct{font-size:1.3rem;font-weight:600;letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.pct.boost{color:var(--orange)}
.chip{display:inline-block;font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--track);color:var(--sub);white-space:nowrap}
.chip.certain,.chip.vlikely,.chip.likely,.chip.got{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.chip.possible,.chip.boost{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.chip.weekly{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.cbar i.certain,.cbar i.vlikely,.cbar i.likely{background:var(--green)}
.cbar i.possible{background:var(--orange)}
.feature{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.feat{background:var(--card);border-radius:20px;padding:22px;box-shadow:var(--shadow);min-width:0}
.feat.gold{background:linear-gradient(150deg,color-mix(in srgb,var(--gold2) 24%,var(--card)),var(--card) 65%)}
.feat .top{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.feat .thumb{width:72px;height:72px}
.feat .p{font-size:2.8rem;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.feat .lines{display:grid;gap:4px;margin-top:12px;font-size:.82rem;color:var(--sub)}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.prize{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);text-align:left;position:relative;transition:transform .1s ease-out}
.prize:active{transform:scale(.98)}
.prize img,.prize .ph{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;background:var(--card2);display:grid;place-items:center;font-size:2rem;filter:grayscale(1);opacity:.55;transition:filter .3s,opacity .3s}
.prize.got img,.prize.got .ph{filter:none;opacity:1}
.prize .name{font-size:.86rem;margin-top:8px}
.prize .check{position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;backdrop-filter:blur(8px)}
.prize.got .check{background:var(--green)}
.prize .check svg{width:13px;height:13px}
.settings{display:grid;gap:28px}
.group h3{font-size:.8rem;font-weight:500;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px 6px}
.set{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 20px;border-top:1px solid var(--line);min-height:54px}
.set:first-child{border-top:0}
.set .lab{min-width:0}
.set .lab div:first-child{font-weight:500}
.set .lab div+div{font-size:.8rem;color:var(--sub)}
.seg{display:inline-flex;background:var(--track);border-radius:9px;padding:2px;flex:none}
.seg button{font-size:.82rem;padding:5px 12px;border-radius:7px;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:500}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0;z-index:1}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--track);transition:background .2s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.switch input:checked+i{background:var(--green)}
.switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:2px solid var(--blue);outline-offset:2px}
.field{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card2);padding:0 12px;font-size:.9rem}
.field:focus{outline:2px solid var(--blue);outline-offset:-1px}
select.field{width:auto}
input[type=range]{accent-color:var(--blue);width:160px}
.code{display:flex;gap:8px;align-items:center;margin-top:12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 9px 9px 14px}
.code code{flex:1;font:.78rem/1.45 ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;word-break:break-all}
.setup{max-width:660px;margin:0 auto;padding:72px 0 40px;text-align:center}
.setup h1{font-size:clamp(2.6rem,7vw,4rem);font-weight:700;letter-spacing:-.04em;line-height:1.05}
.setup .lead{margin:16px auto 36px;max-width:540px}
.steps{text-align:left;display:grid;gap:12px}
.step{background:var(--card);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);display:grid;grid-template-columns:30px 1fr;gap:14px}
.step .num{width:28px;height:28px;border-radius:50%;background:var(--track);display:grid;place-items:center;font-weight:600;font-size:.88rem}
.step p{font-size:.9rem;color:var(--sub);margin-top:3px}
.step .btn{margin-top:14px}
.warn{font-size:.85rem;color:var(--red);margin-top:10px}
.prose{display:grid;gap:12px}
.prose .card p,.prose .card li{font-size:.92rem;color:var(--sub)}
.prose .card p+p{margin-top:8px}
.prose .card ul{padding-left:18px;margin-top:8px;display:grid;gap:4px}
.prose .card h3{margin-bottom:6px}
.ov-stage{border-radius:20px;min-height:220px;display:grid;place-items:center;background:linear-gradient(135deg,#3a6b8f,#7aa36a 60%,#c9b27a);position:relative;overflow:hidden;margin-bottom:12px}
.ov-stage::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,rgba(255,255,255,.25),transparent 60%)}
.ov-stage>div{position:relative;z-index:1}
.ov{color:#fff;font-family:-apple-system,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;text-align:center;line-height:1}
.ov.hud{text-shadow:0 0 3px #000,0 0 3px #000,0 2px 6px rgba(0,0,0,.6)}
.ov .ot{display:flex;align-items:center;justify-content:center;gap:.18em;font-size:3.4em;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ov .ot svg{width:.62em;height:.62em;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.ov .od{width:.2em;height:.2em;border-radius:50%;background:#ff3b30;box-shadow:0 0 6px #ff3b30}
.ov .ol{display:flex;gap:.9em;justify-content:center;margin-top:.45em;font-size:1em;font-weight:700;font-variant-numeric:tabular-nums}
.ov .ol span{opacity:.92}
.ov .ol small{font-size:.75em;opacity:.8;font-weight:600;margin-right:.25em;text-transform:uppercase;letter-spacing:.04em}
.ov.card{background:rgba(18,18,20,.82);backdrop-filter:blur(20px);border-radius:1.1em;padding:1em 1.3em;text-align:left;min-width:15em;border:1px solid rgba(255,255,255,.1)}
.ov.card .ot{justify-content:flex-start;font-size:2.8em}
.ov.card .ol{justify-content:flex-start;flex-wrap:wrap;gap:.3em 1em}
.ov .osq{margin-top:.5em;font-size:.85em;opacity:.8;font-weight:600}
dialog{border:0;border-radius:22px;padding:0;background:var(--card);color:var(--text);width:min(520px,calc(100vw - 32px));box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:var(--scrim);backdrop-filter:blur(4px)}
dialog[open]{animation:pop .3s cubic-bezier(.2,.9,.3,1.1)}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.dlg{padding:24px}
.dlg h2{font-size:1.5rem;margin-bottom:6px}
.dlg .row2{display:flex;gap:8px;align-items:center;margin-top:12px}
.dlg label.ck{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--sub);margin-top:10px}
.dlg .entries{margin-top:14px;max-height:220px;overflow:auto;border-radius:12px;background:var(--card2)}
.dlg .entries .row{padding:9px 14px}
.dlg hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.dlg .foot{display:flex;justify-content:flex-end;margin-top:20px}
footer{border-top:1px solid var(--line);padding:22px 0 40px;font-size:.76rem;color:var(--faint);line-height:1.6}
footer a{color:var(--sub)}
.hidden{display:none!important}
body.obs{background:transparent!important}
body.obs>*:not(#obsRoot){display:none!important}
#obsRoot{display:none;padding:10px}
body.obs #obsRoot{display:block}
@media (max-width:860px){nav .wrap{flex-wrap:wrap;height:auto;padding-top:9px;padding-bottom:7px;gap:8px 12px}.tabs{order:3;flex-basis:100%;justify-content:flex-start;margin:0 -6px}.brand{flex:1}.tiles,.tiles.five{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles.five .tile.hl{grid-column:1/-1}.grid2,.feature{grid-template-columns:1fr}.h2row{flex-direction:column;align-items:flex-start;gap:4px}.h2row .note{text-align:left}}
@media (max-width:560px){.wrap{padding:0 16px}.hero{padding:44px 0 30px}.head{padding:36px 0 20px}.set{flex-wrap:wrap}.hbar{grid-template-columns:minmax(0,1fr) 28% 48px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (prefers-reduced-transparency:reduce){nav{background:var(--bg);backdrop-filter:none}}
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <a class="brand" href="#accueil" style="color:inherit"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" fill="#111113"/><rect x="6" y="14" width="20" height="11" rx="2" fill="#c8952c"/><path d="M6 15a10 8 0 0 1 20 0z" fill="#e8b04b"/><rect x="14.5" y="15" width="3" height="4.5" rx=".8" fill="#fff"/></svg>Coffres</a>
    <div class="tabs" id="tabs"></div>
    <span class="pill" id="status"><span class="dot"></span><span id="statusText"></span></span>
  </div>
  <div class="progress"><i id="prog"></i></div>
</nav>

<main class="wrap" id="main"></main>

<footer><div class="wrap" id="foot"></div></footer>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="obsRoot"></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const CONTENT_URL = 'https://raw.githubusercontent.com/LED-N/Fortnite-ChestCounter/main/content/content.json';
const LIVE_MS = 20000, TIMEOUT_MS = 180000, ENGINE = 3, VERSION = '1.1.1';

const keyOf = (m) => m.epic || m.player || '?';
function profiles() {
  const by = {};

    const k = keyOf(m); const s = m.start ?? m.mtime;

function stats() {

  const total = Math.max(0, replayChests + manualSum);

  const weekManual = week ? Math.max(0, mine.filter((e) => e.week === week.start).reduce((s, e) => s + e.chests, 0)) : 0;
  const weekChests = week ? counted.filter((m) => m.st >= week.from && m.st < week.to).reduce((s, m) => s + m.chests, 0) + weekManual : 0;
  const treasures = counted.flatMap((m) => m.treasures.map((t) => ({ ...t, st: m.st + (t.t || 0) * 1000, match: m })));
  const teamTreasures = counted.flatMap((m) => (m.team || []).map((t) => ({ ...t, st: m.st + (t.t || 0) * 1000, match: m, isTeam: true })));
  const today = dayKey(Date.now());
  const todayM = counted.filter((m) => dayKey(m.st) === today);
  const session = counted.filter((m) => m.mtime >= sessionStart || m.st >= sessionStart);
  const best = counted.reduce((b, m) => (!b || m.chests > b.chests ? m : b), null);
  const got = new Set(all.flatMap((m) => m.treasures.map((t) => prizeFor(t.p)?.id)).filter(Boolean));

}

const idb = new Promise((res, rej) => {
  const r = indexedDB.open('coffres', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function kv(key, value) {
  const db = await idb;
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', value === undefined ? 'readonly' : 'readwrite');
    const req = value === undefined ? tx.objectStore('kv').get(key) : tx.objectStore('kv').put(value, key);
    req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
  });
}
const POOL = Math.max(1, Math.min(3, Math.floor((navigator.hardwareConcurrency || 4) / 3)));
let workers = [], seq = 0;
function makeWorker() {
  const w = new Worker('worker.js', { type: 'module' });
  w.ready = new Promise((res, rej) => { w.onmessage = (e) => e.data.ready && res(); w.onerror = rej; });
  return w;
}
async function analyze(slot, file) {
  const w = workers[slot];
  await w.ready;
  const buf = await file.arrayBuffer(), id = ++seq;
  return new Promise((res) => {
    const timer = setTimeout(() => { w.terminate(); workers[slot] = makeWorker(); res({ ok: false, error: 'Timeout' }); }, TIMEOUT_MS);
    w.onmessage = (e) => { if (e.data.id === id) { clearTimeout(timer); res(e.data.out); } };
    w.postMessage({ id, name: file.name, buf }, [buf]);
  });
}
async function scan() {
  if (mode !== 'web' || !dir || scanning) return;
  scanning = true;
  try {
    const todo = []; let newest = 0;
    for await (const [name, h] of dir.entries()) {
      if (h.kind !== 'file' || !name.endsWith('.replay')) continue;
      const f = await h.getFile();
      newest = Math.max(newest, f.lastModified);
      if (Date.now() - f.lastModified < LIVE_MS) continue;
      const k = matches[name];
      if (!k || k.v !== ENGINE || (k.error && k.size !== f.size)) todo.push(f);
    }
    live = Date.now() - newest < LIVE_MS;
    todo.sort((a, b) => b.lastModified - a.lastModified);
    qTotal = todo.length; qDone = 0; update();
    if (todo.length && !workers.length) workers = Array.from({ length: POOL }, makeWorker);
    let next = 0;
    await Promise.all(workers.map(async (_, slot) => {
      while (next < todo.length) {
        const f = todo[next++], r = await analyze(slot, f);
        const isNew = !matches[f.name] && f.lastModified >= sessionStart;
        matches[f.name] = { file: f.name, size: f.size, mtime: f.lastModified, v: ENGINE, ...(r.ok ? r.m : { error: r.error }) };
        if (isNew && r.ok && r.m.counts && prefs.notifyMatches && window.Notification?.permission === 'granted') {
          new Notification(T(`Partie comptée : +${r.m.chests} coffres`, `Match counted: +${r.m.chests} chests`, `Partida contada: +${r.m.chests} cofres`), { body: r.m.treasures.length ? '★ ' + r.m.treasures.map((t) => prizeFor(t.p)?.name || t.n).join(', ') : `Total : ${N(stats().total)}`, icon: 'icon.png' });
        }
        qDone++;
        await kv('matches', matches);
        update();
      }
    }));
  } catch (e) {
    if (e.name === 'NotAllowedError' || e.name === 'NotFoundError') { dir = null; go('accueil'); }
    else console.error(e);
  } finally { scanning = false; qTotal = qDone = 0; update(); }
}

function countTo(el, to) {

}

function banners(s) {
  const now = Date.now(), out = [];
  for (const n of content?.notices || []) {
    if (dismissed.includes(n.id) || now < Date.parse(n.from) || now >= Date.parse(n.to)) continue;
    out.push(`<div class="banner info"><div class="grow"><div class="bt">${esc(n.title?.[prefs.lang] || n.title?.en)}</div><div class="bd">${esc(n.text?.[prefs.lang] || n.text?.en)}</div></div><button class="icon-btn" data-dismiss="${esc(n.id)}" aria-label="OK">✕</button></div>`);
  }
  const h = hours().find((h) => now < h.to);
  if (h && h.from - now < 3 * 864e5) {
    const on = now >= h.from;
    const b = Object.entries(h.boosts).map(([k, v]) => `${kindName(k)} ×${N(v)}`).join(' · ');
    out.push(`<div class="banner"><div style="font-size:1.6rem">⏳</div><div class="grow"><div class="bt">${on ? T('Heure du trésor en cours', 'Treasure Hour now', 'Hora del tesoro ahora') + ` · ${T('encore', 'for', 'quedan')} ${left(h.to)}` : T('Prochaine heure du trésor', 'Next Treasure Hour', 'Próxima hora del tesoro') + ` · ${when(h.from)} · ${T('dans', 'in', 'en')} ${left(h.from)}`}${h.confirmed ? '' : ` <span class="chip">${T('prévue', 'expected', 'prevista')}</span>`}</div><div class="bd">${esc(b)}</div></div></div>`);
  }
  return out.join('');
}

      <div class="eyebrow">${T('Coffres ouverts', 'Chests opened', 'Cofres abiertos')}${content ? T(' · saison', ' · season', ' · temporada') : ''}${prefs.squad ? T(' · avec l\'escouade', ' · with squad', ' · con el escuadrón') : ''}</div>
      <div class="big"><span id="total">${N(shownTotal)}</span>${live ? '<span class="live-dot" title="live"></span>' : ''}</div>
      <p class="lead">${liveChests ? `<b>+${N(liveChests)}</b> ${T('dans la partie en cours', 'in the current match', 'en la partida actual')} · ` : ''}${s.week ? `<b>${N(s.weekChests)}</b> ${T('cette semaine', 'this week', 'esta semana')} · ` : ''}${plural(s.counted.length, 'partie', 'match', 'partida')}</p>

      <div class="tile"><div class="k">${T('Cette session', 'This session', 'Esta sesión')}</div><div class="v">${N(sessionChests)}</div><div class="s">${plural(s.session.length, 'partie', 'match', 'partida')}</div></div>
      <div class="tile"><div class="k">${T("Aujourd'hui", 'Today', 'Hoy')}</div><div class="v">${N(s.todayM.reduce((a, m) => a + m.chests, 0))}</div><div class="s">${plural(s.todayM.length, 'partie', 'match', 'partida')}</div></div>
      <div class="tile"><div class="k">${T('Trésors', 'Treasures', 'Tesoros')}</div><div class="v">${N(s.treasures.length)}</div><div class="s">${s.treasures.length ? T(`1 tous les ${N(Math.round(s.total / s.treasures.length))} coffres`, `1 every ${N(Math.round(s.total / s.treasures.length))} chests`, `1 cada ${N(Math.round(s.total / s.treasures.length))} cofres`) : T('pas encore', 'none yet', 'aún ninguno')}</div></div>

    <section><div class="h2row"><h2>${T('Activité', 'Activity', 'Actividad')}</h2><a class="note" href="#parties">${T('Toutes les parties', 'All matches', 'Todas las partidas')} →</a></div>
      <div class="list">${recent || `<div class="empty">${qTotal ? T('Analyse des replays…', 'Reading replays…', 'Leyendo repeticiones…') : T('Aucune partie pour l\'instant. Lance une partie : elle apparaît ici quelques secondes après la fin.', 'No match yet. Play one: it shows up here a few seconds after it ends.', 'Aún no hay partidas. Juega una: aparece aquí segundos después.')}`}</div></div></section>`;

function weeklyFor(kind, s) {
  const o = oddsOf(kind); if (!o) return null;
  const c = o.weekly ? chance(o, s.weekTimes, s.weekManual) : (s.manualSum >= 0 ? chance(o, s.times, s.manualSum) : chance(o, [], Math.max(0, s.times.length + s.manualSum)));
  const prize = o.weekly ? s.week?.prizes.find((p) => p.kind === kind || (kind === 'pickaxe' && p.kind === 'backbling')) : kind === 'pirate-shop' ? content.pirateShop : null;
  return { o, c, prize };
}
function oddCard(kind, s) {
  const r = weeklyFor(kind, s); if (!r) return '';
  const { o, c, prize } = r, [cls, word] = verdict(c.p);
  return `<div class="odd">${img(prize, 'thumb', kind)}<div class="meta">
    <div class="kind">${esc(kindName(kind))}${owned(prize, s) ? `<span class="chip got">✓ ${T('Obtenu', 'Got it', 'Conseguido')}</span>` : ''}</div>
    <div class="name">${esc(prize?.name || (kind === 'gizmo' ? T('Fusées, extracteurs, localisateurs…', 'Fireworks, extractors, locators…', 'Fuegos, extractores, localizadores…') : T('Pas encore annoncé', 'Not announced yet', 'Aún no anunciado')))}</div>
    <div class="cbar"><i class="${cls}" style="width:${Math.max(c.p * 100, 0.8)}%"></i></div>
    <div class="line"><span>1 ${T('sur', 'in', 'entre')} ${N(o.oneIn)} · ${N(c.n)} ${T('coffres', 'chests', 'cofres')} ${o.weekly ? T('cette semaine', 'this week', 'esta semana') : T('cette saison', 'this season', 'esta temporada')} <span class="chip ${cls}">${word}</span></span><span class="pct${c.boosted ? ' boost' : ''}">${pct(c.p)}</span></div></div></div>`;
}

function chancesPage(s) {
  if (!content) return `<div class="head"><h1>${T('Tes chances', 'Your chances', 'Tus probabilidades')}</h1><p>${T('Chargement des données de la chasse…', 'Loading the hunt data…', 'Cargando los datos de la búsqueda…')}</p></div>`;
  const now = Date.now(), wk = s.week;
  const seasonPace = s.times.length ? s.times.length / Math.max(1, (now - s.times[0]) / 864e5) : 0;
  let weekPace = wk ? (s.weekTimes.length + s.weekManual) / Math.max(1, (now - wk.from) / 864e5) : 0;
  if (!(weekPace > 0)) weekPace = seasonPace;
  const projection = (o, c, weekly) => {
    const end = weekly ? wk?.to ?? now : huntEnd(), pace = weekly ? weekPace : seasonPace;
    if (pace <= 0 || now >= end || c.p >= 0.75) return '';
    const p = -Math.expm1(c.log + pace * (end - now) / 864e5 * Math.log1p(-1 / o.oneIn));
    return `≈ ${pct(p)} ${weekly ? T("d'ici la fin de la semaine à ton rythme", 'by the end of the week at your pace', 'al final de la semana a tu ritmo') : T("d'ici la fin de la chasse à ton rythme", 'by the end of the hunt at your pace', 'al final de la búsqueda a tu ritmo')}`;
  };
  const feat = (kind) => {
    const r = weeklyFor(kind, s); if (!r) return '';
    const { o, c, prize } = r, [cls, word] = verdict(c.p), half = chestsFor(o.oneIn, 0.5);
    const allWeeks = kind === 'outfit' ? chance(o, s.times, Math.max(0, s.manualSum)) : null;
    const lines = [
      `${T('Chaque coffre', 'Each chest', 'Cada cofre')} : 1 ${T('sur', 'in', 'entre')} ${N(o.oneIn)} · ${N(c.n)} ${T('coffres', 'chests', 'cofres')} ${o.weekly ? T('cette semaine', 'this week', 'esta semana') : T('cette saison', 'this season', 'esta temporada')}${c.p > 0 ? ` · ${T('environ 1 sur', 'about 1 in', 'aprox. 1 entre')} ${N(Math.max(1, Math.round(1 / c.p)))}` : ''}`,
      allWeeks ? `${T('Toutes les semaines réunies', 'All weeks combined', 'Todas las semanas')} : <b>${pct(allWeeks.p)}</b> ${T('sur', 'over', 'en')} ${N(allWeeks.n)} ${T('coffres', 'chests', 'cofres')}` : '',
      o.weekly && wk ? `${T('Cette tenue part dans', 'This outfit leaves in', 'Este atuendo se va en')} ${left(wk.to)}` : '',
      projection(o, c, o.weekly),
    ].filter(Boolean).map((l) => `<div>${l}</div>`).join('');
    const prog = Math.min(100, c.n / half * 100);
    return `<div class="feat${kind === 'outfit' ? ' gold' : ''}"><div class="top">${img(prize, 'thumb', kind)}<div style="min-width:0"><div class="kind">${esc(kindName(kind))} <span class="chip ${o.weekly ? 'weekly' : ''}">${o.weekly ? T('Hebdo', 'Weekly', 'Semanal') : T('Saison', 'Season', 'Temporada')}</span>${owned(prize, s) ? `<span class="chip got">✓ ${T('Obtenu', 'Got it', 'Conseguido')}</span>` : ''}</div><div class="name">${esc(prize?.name || T('Pas encore annoncé', 'Not announced yet', 'Aún no anunciado'))}</div></div></div>
      <div class="p"><span class="${c.boosted ? 'pct boost' : ''}" style="font-size:inherit">${pct(c.p)}</span><span class="chip ${cls}">${word}</span></div>
      <div class="note" style="margin-top:4px">${o.weekly ? T("chance qu'elle soit tombée pour toi cette semaine", 'chance it dropped for you this week', 'probabilidad de que te haya tocado esta semana') : T("chance qu'il soit tombé pour toi cette saison", 'chance it dropped for you this season', 'probabilidad de que te haya tocado esta temporada')}</div>
      <div class="cbar" style="margin-top:14px"><i class="${cls}" style="width:${Math.max(prog, 0.8)}%"></i></div>
      <div class="line"><span>${T('Vers une chance sur deux', 'Halfway to a 50/50 chance', 'Hacia un 50 %')}</span><span>${N(c.n)} / ${N(half)} ${T('coffres', 'chests', 'cofres')}</span></div>
      <div class="lines">${lines}</div></div>`;
  };
  const weeklyRows = ['car', 'pickaxe', 'jam', 'loading', 'gizmo'].map((k) => {
    const r = weeklyFor(k, s); if (!r) return '';
    const { o, c, prize } = r, [cls, word] = verdict(c.p);
    return `<div class="row"><div style="display:flex;gap:12px;align-items:center;min-width:0">${img(prize, 'thumb', k).replace('class="thumb', 'style="width:44px;height:44px;border-radius:10px" class="thumb')}<div style="min-width:0"><div class="t">${esc(kindName(k))} ${owned(prize, s) ? `<span class="chip got">✓</span>` : ''}</div><div class="d">${esc(prize?.name || (k === 'gizmo' ? T('Toute la chasse', 'Whole hunt', 'Toda la búsqueda') : '—'))} · 1 ${T('sur', 'in', 'entre')} ${N(o.oneIn)}</div><div class="cbar" style="margin:6px 0 0;width:min(260px,40vw)"><i class="${cls}" style="width:${Math.max(c.p * 100, 0.8)}%"></i></div></div></div>
      <div class="n"><span class="${c.boosted ? 'pct boost' : ''}" style="font-size:inherit">${pct(c.p)}</span><small><span class="chip ${cls}">${word}</span> · ≈ ${N(c.exp, { maximumFractionDigits: c.exp < 10 ? 1 : 0 })} ${T('attendu', 'expected', 'esperado')}</small></div></div>`;
  }).join('');
  return `<div class="head"><h1>${T('Tes chances', 'Your chances', 'Tus probabilidades')}</h1><p>${T("Chaque coffre est un nouveau tirage : tes chances ne s'accumulent pas. Ces chiffres montrent la chance qu'un trésor soit déjà tombé pour toi au moins une fois.", "Every chest is a fresh roll: your odds don't build up. These numbers show the chance a treasure already dropped for you at least once.", 'Cada cofre es una tirada nueva: tus probabilidades no se acumulan. Estas cifras muestran la probabilidad de que un tesoro ya te haya tocado al menos una vez.')}</p></div>
    ${banners(s)}
    <div class="feature">${feat('outfit')}${feat('pirate-shop')}</div>
    <section><div class="h2row"><h2>${wk ? `${T('Semaine', 'Week', 'Semana')} ${wk.number} · ${esc(wk.title)}` : T('Hors chasse', 'No hunt', 'Sin búsqueda')}</h2><div class="note">${wk ? `${N(s.weekChests)} ${T('coffres cette semaine', 'chests this week', 'cofres esta semana')} · ${now < wk.to ? T('se termine dans', 'ends in', 'termina en') + ' ' + left(wk.to) : T('terminée', 'over', 'terminada')}` : ''}</div></div>
      <div class="list">${weeklyRows}</div></section>
    <section><div class="card prose" style="display:block"><h3>${T('Comment c\'est calculé ?', 'How is this calculated?', '¿Cómo se calcula?')}</h3>
      <p>${T('Chance d\'avoir eu un trésor au moins une fois = 1 − (1 − 1/N)<sup>coffres</sup>, avec les cotes publiées par Epic. Un coffre ne donne que le trésor de sa semaine : les trésors hebdo comptent les coffres de la semaine, l\'accès à la boutique pirate et les gadgets comptent toute la chasse. Pendant une heure du trésor, chaque coffre compte avec sa cote augmentée (en orange). Les coffres ajoutés à la main comptent avec la cote normale.', 'Chance of at least one treasure = 1 − (1 − 1/N)<sup>chests</sup>, with the odds published by Epic. A chest only gives its week\'s treasure: weekly treasures count this week\'s chests, Pirate Shop Access and gizmos count the whole hunt. During a Treasure Hour, each chest counts with its boosted odds (orange). Chests added by hand count with normal odds.', 'Probabilidad de al menos un tesoro = 1 − (1 − 1/N)<sup>cofres</sup>, con las probabilidades publicadas por Epic. Un cofre solo da el tesoro de su semana. Durante una hora del tesoro, cada cofre cuenta con su probabilidad aumentada (en naranja).')}</p></div></section>`;
}

function matchRow(m) {
  const open = expanded.has(m.file);
  const kinds = Object.entries(m.list.reduce((a, c) => (a[c.k + (c.d ? '|d' : '')] = (a[c.k + (c.d ? '|d' : '')] || 0) + 1, a), {}));
  const detail = open ? `<div class="detail">
      <div><b>${T('Coffres', 'Chests', 'Cofres')}</b><ul>${kinds.map(([k, n]) => { const [kk, d] = k.split('|'); return `<li>${n} × ${esc(chestName(kk))}${d ? ` (${T('détruit', 'destroyed', 'destruido')})` : ''}</li>`; }).join('') || '<li>—</li>'}</ul></div>
      <div><b>${T('Trésors', 'Treasures', 'Tesoros')}</b><ul>${m.treasures.map((t) => `<li>★ ${esc(prizeFor(t.p)?.name || t.n)}${t.t != null ? ` · ${mmss(t.t)}` : ''}${t.chest === false ? ' ⚑' : ''}</li>`).join('') || '<li>—</li>'}</ul></div>
      ${m.mates?.length ? `<div><b>${T('Escouade', 'Squad', 'Escuadrón')}</b><ul>${m.mates.map((x) => `<li>${esc(x.n || '?')}${x.bot ? ' (bot)' : ''} · ${x.c} ${T('coffres', 'chests', 'cofres')}</li>`).join('')}</ul></div>` : ''}
      <div><b>${T('Partie', 'Match', 'Partida')}</b><ul>${m.dur ? `<li>${mmss(m.dur)}</li>` : ''}${m.vehM ? `<li>🚗 ${N(m.vehM / 1000, { maximumFractionDigits: 1 })} km · ${mmss(m.vehSec)}</li>` : ''}${m.vehMissing ? `<li>⚠️ ${T('des coffres cassés en véhicule manquent peut-être', 'chests broken by vehicle may be missing', 'pueden faltar cofres rotos con vehículo')}</li>` : ''}${m.why ? `<li>${esc(m.why)}</li>` : ''}<li style="opacity:.6">${esc(m.file)}</li></ul></div>
    </div>` : '';
  return `<div class="row click${m.counts ? '' : ' off'}" data-match="${esc(m.file)}"><div style="min-width:0"><div class="t">${esc(modeName(m.playlist))}</div><div class="d">${when(m.st)}${m.place ? ` · top ${m.place}` : ''}${m.kills != null ? ` · ${m.kills} ${T('élim.', 'elims', 'elim.')}` : ''}${m.treasures.length ? ` · ★ ${m.treasures.length}` : ''}${m.counts ? '' : ` · ${T('ne compte pas', "doesn't count", 'no cuenta')}`}</div></div><div class="n">${N(m.chests)}<small>${T('coffres', 'chests', 'cofres')}</small></div>${detail}</div>`;
}

function matchesPage(s) {
  const list = (prefs.showOff ? s.all : s.counted);
  const errors = Object.values(matches).filter((m) => m.error).length;

function report(s) {
  const total = s.total + (prefs.squad ? s.teamChests : 0);
  const avg = s.counted.length ? s.counted.reduce((a, m) => a + m.chests + (prefs.squad ? m.teamChests || 0 : 0), 0) / s.counted.length : 0;
  const perDay = {};
  for (const m of s.counted) perDay[dayKey(m.st)] = (perDay[dayKey(m.st)] || 0) + m.chests + (prefs.squad ? m.teamChests || 0 : 0);
  const first = Math.min(s.counted.length ? Math.max(s.counted.at(-1).st, Date.now() - 59 * 864e5) : Date.now(), Date.now() - 29 * 864e5);
  const days = []; for (let t = first; dayKey(t) <= dayKey(Date.now()); t += 864e5) days.push(dayKey(t));
  const max = Math.max(1, ...days.map((d) => perDay[d] || 0));
  const bestDay = days.reduce((b, d) => ((perDay[d] || 0) > (perDay[b] || 0) ? d : b), days[0]);
  const W = days.length * 12;
  const chart = `<svg viewBox="0 0 ${W} 100" preserveAspectRatio="none" role="img" aria-label="${T('Coffres par jour', 'Chests per day', 'Cofres por día')}">${days.map((d, i) => { const v = perDay[d] || 0, h = v ? Math.max(2, v / max * 96) : 1; return `<rect x="${i * 12 + 2}" y="${100 - h}" width="8" height="${h}" rx="2" fill="${d === bestDay && v ? 'var(--orange)' : v ? 'var(--gold2)' : 'var(--track)'}"><title>${d} · ${v}</title></rect>`; }).join('')}</svg>`;
  const byKind = {};
  for (const m of s.counted) for (const c of m.list) if (isChestKind(c.k)) byKind[c.k] = (byKind[c.k] || 0) + 1;
  const kinds = Object.entries(byKind).sort((a, b) => b[1] - a[1]); const kmax = Math.max(1, ...kinds.map((k) => k[1]));
  const bySrc = {};
  for (const t of s.treasures) { const k = (t.g ? 'Coffre doré' : t.src || 'inconnu') + (t.dest ? '|d' : ''); bySrc[k] = (bySrc[k] || 0) + 1; }
  const others = {};
  for (const m of s.counted) for (const [k, v] of Object.entries(m.other || {})) others[k] = (others[k] || 0) + v;
  const veh = s.counted.reduce((a, m) => [a[0] + (m.vehSec || 0), a[1] + (m.vehM || 0), a[2] + (m.vehMissing ? 1 : 0)], [0, 0, 0]);
  const seen = s.all.flatMap((m) => (m.seen || []).map((x) => ({ ...x, prize: prizeFor(x.p), st: m.st }))).filter((x) => ['outfit', 'pirate-shop'].includes(x.prize?.kind));
  const treasureList = (prefs.teamTreasures ? [...s.treasures, ...s.teamTreasures] : s.treasures).sort((a, b) => b.st - a.st);
  const hb = (label, n, mx) => `<div class="hbar"><span>${label}</span><span class="b"><i style="width:${n / mx * 100}%"></i></span><span class="c">${N(n)}</span></div>`;
  return `<div class="head"><h1>${T('Rapport', 'Report', 'Informe')}</h1><p>${T('Tout ce que tes replays racontent, mis à jour après chaque partie.', 'Everything your replays tell, updated after each match.', 'Todo lo que cuentan tus repeticiones, actualizado tras cada partida.')}</p></div>
    <div class="tiles five">
      <div class="tile hl"><div class="k">${T('Coffres au total', 'Chests in total', 'Cofres en total')}</div><div class="v">${N(total)}</div><div class="s">${s.manualSum ? `${s.manualSum > 0 ? '+' : ''}${N(s.manualSum)} ${T('à la main', 'by hand', 'a mano')}` : T('ouverts ou détruits par toi', 'opened or destroyed by you', 'abiertos o destruidos por ti')}</div><button class="icon-btn" data-act="manual" aria-label="${T('Modifier', 'Edit', 'Editar')}">${ICON.pencil}</button></div>
      <div class="tile"><div class="k">${T('Parties', 'Matches', 'Partidas')}</div><div class="v">${N(s.counted.length)}</div><div class="s">${T('analysées', 'analyzed', 'analizadas')}</div></div>
      <div class="tile"><div class="k">${T('Moyenne', 'Average', 'Media')}</div><div class="v">${s.counted.length ? N(avg, { maximumFractionDigits: 1 }) : '–'}</div><div class="s">${T('par partie', 'per match', 'por partida')}</div></div>
      <div class="tile"><div class="k">${T('Meilleure partie', 'Best match', 'Mejor partida')}</div><div class="v">${s.best ? N(s.best.chests) : '–'}</div><div class="s">${s.best ? day(s.best.st) : ''}</div></div>
      <div class="tile"><div class="k">${T('Trésors', 'Treasures', 'Tesoros')}</div><div class="v">${N(s.treasures.length)}</div><div class="s">${s.treasures.length ? `1 / ${N(Math.round(s.total / s.treasures.length))} ${T('coffres', 'chests', 'cofres')}` : '—'}${s.teamTreasures.length ? ` · +${s.teamTreasures.length} ${T('équipe', 'team', 'equipo')}` : ''}</div></div>
    </div>
    <label class="note" style="display:flex;gap:10px;align-items:center;justify-content:flex-end;margin:-36px 0 40px">${T("Ajouter le total de l'escouade", 'Add the squad total', 'Añadir el total del escuadrón')} <span class="chip possible">${T('inexact', 'inaccurate', 'inexacto')}</span><span class="switch"><input type="checkbox" data-pref="squad" ${prefs.squad ? 'checked' : ''}><i></i></span></label>
    <section><div class="h2row"><h2>${T('Coffres par jour', 'Chests per day', 'Cofres por día')}</h2><div class="note">${perDay[bestDay] ? `${T('meilleur jour', 'best day', 'mejor día')} : ${day(Date.parse(bestDay))} · ${N(perDay[bestDay])}` : ''}</div></div>
      <div class="card chart">${chart}<div class="axis"><span>${days[0] ? day(Date.parse(days[0])) : ''}</span><span>${T("aujourd'hui", 'today', 'hoy')}</span></div></div></section>
    <div class="grid2" style="margin-bottom:56px">
      <div><h2 style="margin-bottom:16px">${T('Par type de coffre', 'By chest type', 'Por tipo de cofre')}</h2><div class="card">${kinds.map(([k, n]) => hb(esc(chestName(k)), n, kmax)).join('') || `<div class="note">—</div>`}
        ${Object.keys(others).length ? `<div class="note" style="margin-top:12px">${T('Aussi', 'Also', 'También')} : ${Object.entries(others).map(([k, v]) => `${N(v)} × ${esc(chestName(k).toLowerCase())}`).join(' · ')}</div>` : ''}</div></div>
      <div><h2 style="margin-bottom:16px">${T("D'où viennent tes trésors", 'Where your treasures come from', 'De dónde vienen tus tesoros')}</h2><div class="card">${Object.entries(bySrc).sort((a, b) => b[1] - a[1]).map(([k, n]) => { const [kk, d] = k.split('|'); return hb(esc(chestName(kk)) + (d ? ` (${T('détruit', 'destroyed', 'destruido')})` : ''), n, Math.max(...Object.values(bySrc))); }).join('') || `<div class="note">${T('Pas encore de trésor.', 'No treasure yet.', 'Aún no hay tesoros.')}</div>`}
        ${veh[1] ? `<div class="note" style="margin-top:12px">🚗 ${N(veh[1] / 1000, { maximumFractionDigits: 1 })} km ${T('en véhicule', 'in vehicles', 'en vehículo')} · ${N(Math.round(veh[0] / 60))} min${veh[2] ? ` · ⚠️ ${veh[2]} ${T('parties avec des coffres peut-être manquants', 'matches with possibly missing chests', 'partidas con cofres quizá perdidos')}` : ''}</div>` : ''}</div></div>
    </div>
    <section><div class="h2row"><h2>${T('Trésors trouvés', 'Treasures found', 'Tesoros encontrados')}</h2><label class="note" style="display:flex;gap:10px;align-items:center">${T("Trésors de l'équipe", 'Team treasures', 'Tesoros del equipo')}<span class="switch"><input type="checkbox" data-pref="teamTreasures" ${prefs.teamTreasures ? 'checked' : ''}><i></i></span></label></div>
      <div class="list">${treasureList.slice(0, limits.treasures).map((t) => { const p = prizeFor(t.p); return `<div class="row"><div style="display:flex;gap:12px;align-items:center;min-width:0">${p ? img(p, 'thumb').replace('class="thumb', 'style="width:40px;height:40px;border-radius:9px" class="thumb') : ''}<div style="min-width:0"><div class="t">${t.isTeam ? '👥 ' : ''}${esc(p?.name || t.n)}${t.chest === false ? ` <span class="chip" title="${T('fiabilité faible', 'low reliability', 'fiabilidad baja')}">⚑</span>` : ''}</div><div class="d">${esc(p ? kindName(p.kind) : chestName(t.g ? 'Coffre doré' : t.src || 'inconnu'))}${t.isTeam && t.mate ? ` · ${esc(t.mate)}` : ''} · ${when(t.st)}</div></div></div><div class="n">${t.g ? '★★' : '★'}</div></div>`; }).join('') || `<div class="empty">${T('Pas encore de trésor.', 'No treasure yet.', 'Aún no hay tesoros.')}</div>`}${treasureList.length > limits.treasures ? `<button class="more" data-more="treasures">${T('Afficher plus', 'Show more', 'Mostrar más')}</button>` : ''}</div></section>
    <section><div class="h2row"><h2>${T('Ils l\'ont eu dans tes parties', 'They got it in your matches', 'Lo consiguieron en tus partidas')}</h2><div class="note">${T('expérimental', 'experimental', 'experimental')}</div></div>
      <div class="list">${seen.map((x) => `<div class="row"><div><div class="t">${esc(x.who || '?')}</div><div class="d">${esc(x.prize.name)} · ${when(x.st + x.t * 1000)}</div></div><div class="n">${x.prize.kind === 'outfit' ? '👑' : '🏴‍☠️'}</div></div>`).join('') || `<div class="empty">${T('Personne près de toi n\'a eu de tenue en or ni d\'accès à la boutique pirate.', 'Nobody near you got a gold outfit or Pirate Shop Access.', 'Nadie cerca de ti consiguió un atuendo dorado ni acceso a la tienda pirata.')}</div>`}</div></section>`;
}

function collectionPage(s) {
  if (!content) return `<div class="head"><h1>Collection</h1><p>${T('Chargement…', 'Loading…', 'Cargando…')}</p></div>`;
  const now = Date.now();
  const card = (p) => `<button class="prize${owned(p, s) ? ' got' : ''}" data-prize="${esc(p.id)}">${img(p, '')}<div class="kind" style="margin-top:8px">${esc(kindName(p.kind))}</div><div class="name">${esc(p.name)}</div><span class="check">${ICON.check}</span></button>`;

  return `<div class="head"><h1>${T('Ta collection', 'Your collection', 'Tu colección')}</h1><p>${T(`${have} sur ${total} trésors. Un trésor de coffre doré vu dans tes replays se coche tout seul ; touche une carte pour cocher ou décocher.`, `${have} of ${total} treasures. A golden chest treasure seen in your replays is ticked by itself; tap a card to tick or untick it.`, `${have} de ${total} tesoros. Un tesoro de cofre dorado visto en tus repeticiones se marca solo; toca una carta para marcarla.`)}</p></div>

function manualDialog() {
  const s = stats(), wk = s.week;
  const est = s.mine.find((e) => e.kind === 'estimate');
  $('dlgBody').innerHTML = `<h2>${T('Coffres ouverts avant', 'Chests opened before', 'Cofres abiertos antes')}</h2>
    <p class="note">${T('Chaque nombre s\'ajoute au total (un nombre négatif en retire).', 'Each number is added to the total (a negative number removes some).', 'Cada número se suma al total (uno negativo resta).')}</p>
    <div class="row2"><input class="field" id="mNum" type="number" step="1" placeholder="${T('ex. 250', 'e.g. 250', 'p. ej. 250')}" inputmode="numeric"><button class="btn" id="mAdd">${T('Ajouter', 'Add', 'Añadir')}</button></div>
    ${wk ? `<label class="ck"><input type="checkbox" id="mWeek"> ${T('Ouverts cette semaine (comptent aussi dans les chances de la semaine)', 'Opened this week (also count in this week\'s chances)', 'Abiertos esta semana (cuentan en las probabilidades de la semana)')}</label>` : ''}
    <hr>
    <h3>${T('Tu ne sais pas combien ?', "Don't know how many?", '¿No sabes cuántos?')}</h3>
    <p class="note" style="margin-top:4px">${T('Entre le nombre de parties affiché dans Fortnite (Carrière → Stats) : les parties non vues sont multipliées par ta moyenne. Une nouvelle estimation remplace la précédente.', 'Enter the number of matches shown in Fortnite (Career → Stats): unseen matches are multiplied by your average. A new estimate replaces the previous one.', 'Introduce las partidas que muestra Fortnite (Carrera → Estadísticas): las no vistas se multiplican por tu media.')}</p>
    <div class="row2"><input class="field" id="mCareer" type="number" min="0" step="1" placeholder="${T('parties', 'matches', 'partidas')}" value="${est?.career ?? ''}"><button class="btn ghost" id="mEst" ${s.counted.length ? '' : 'disabled'}>${T('Estimer', 'Estimate', 'Estimar')}</button></div>
    <div class="entries">${s.mine.map((e) => `<div class="row"><div><div class="t">${e.chests > 0 ? '+' : ''}${N(e.chests)} ${T('coffres', 'chests', 'cofres')}</div><div class="d">${e.kind === 'estimate' ? `${T('estimation', 'estimate', 'estimación')} · ${N(e.career)} ${T('parties', 'matches', 'partidas')} · ` : ''}${e.week ? T('cette semaine · ', 'this week · ', 'esta semana · ') : ''}${when(e.at)}</div></div><button class="icon-btn" data-del="${e.id}" aria-label="${T('Retirer', 'Remove', 'Quitar')}">✕</button></div>`).join('') || `<div class="empty" style="padding:14px">${T('Rien ajouté.', 'Nothing added.', 'Nada añadido.')}</div>`}</div>
    <div class="foot"><button class="btn ghost" id="mClose">${T('OK', 'Done', 'Listo')}</button></div>`;
  const saveManual = () => { store.set('manual', manual); manualDialog(); render(); };
  $('mAdd').onclick = () => { const n = parseInt($('mNum').value, 10); if (!n) return; manual.push({ id: crypto.randomUUID(), chests: n, at: Date.now(), kind: 'hand', profile: s.pk, week: $('mWeek')?.checked ? wk.start : null }); saveManual(); };
  $('mEst').onclick = () => {
    const career = parseInt($('mCareer').value, 10); if (!(career >= 0)) return;
    const avg = s.counted.reduce((a, m) => a + m.chests, 0) / s.counted.length;
    manual = manual.filter((e) => !(e.kind === 'estimate' && (e.profile ?? s.pk) === s.pk));
    const n = Math.round(Math.max(0, career - s.counted.length) * avg);
    if (n) manual.push({ id: crypto.randomUUID(), chests: n, at: Date.now(), kind: 'estimate', career, profile: s.pk, week: null });
    saveManual();
  };
  $('dlgBody').querySelectorAll('[data-del]').forEach((b) => b.onclick = () => { manual = manual.filter((e) => e.id !== b.dataset.del); saveManual(); });
  $('mClose').onclick = () => $('dlg').close();
  if (!$('dlg').open) $('dlg').showModal();
}

// ---------------- events ----------------
function bind() {
  const root = $('main');
  root.querySelectorAll('[data-copy]').forEach((b) => b.onclick = async () => { await navigator.clipboard.writeText($(b.dataset.copy).textContent); const t = b.textContent; b.textContent = T('Copié', 'Copied', 'Copiado'); setTimeout(() => b.textContent = t, 1400); });
  root.querySelectorAll('[data-pref]').forEach((i) => i.onchange = async () => {
    if (i.dataset.pref === 'notifyMatches' && i.checked && mode === 'web' && window.Notification && Notification.permission !== 'granted' && await Notification.requestPermission() !== 'granted') { i.checked = false; return; }
    prefs[i.dataset.pref] = i.checked; savePrefs(); lastSig = ''; render();
  });
  root.querySelectorAll('[data-set]').forEach((b) => b.onclick = () => { const v = b.dataset.val; prefs[b.dataset.set] = v === 'true' ? true : v === 'false' ? false : v; savePrefs(); lastSig = ''; render(); });
  root.querySelectorAll('[data-ov]').forEach((b) => b.onclick = () => { prefs.overlay[b.dataset.ov] = b.dataset.val; savePrefs(); render(); });
  root.querySelectorAll('[data-ovr]').forEach((i) => i.oninput = () => { prefs.overlay[i.dataset.ovr] = Number(i.value); savePrefs(); renderOverlays(stats()); const u = $('obsUrl'); if (u) u.textContent = obsUrl(); });
  root.querySelectorAll('[data-ovc]').forEach((i) => i.onchange = () => { prefs.overlay[i.dataset.ovc] = i.checked; savePrefs(); if (mode === 'exe') setTimeout(poll, 800); render(); });
  root.querySelectorAll('[data-more]').forEach((b) => b.onclick = () => { limits[b.dataset.more] += 20; render(); });
  root.querySelectorAll('[data-match]').forEach((r) => r.onclick = () => { const f = r.dataset.match; expanded.has(f) ? expanded.delete(f) : expanded.add(f); render(); });
  root.querySelectorAll('[data-prize]').forEach((b) => b.onclick = () => { const id = b.dataset.prize, s = stats(), p = allPrizes().find((x) => x.id === id); collection[id] = !owned(p, s); if (collection[id] === s.got.has(id)) delete collection[id]; store.set('collection', collection); render(); });
  root.querySelectorAll('[data-dismiss]').forEach((b) => b.onclick = () => { dismissed.push(b.dataset.dismiss); store.set('dismissed', dismissed); render(); });
  root.querySelectorAll('[data-act]').forEach((el) => {
    const act = el.dataset.act;
    const run = async () => {
      try {
        if (act === 'pick') await pickFolder();
        if (act === 'manual') manualDialog();
        if (act === 'pip') await openPip();
        if (act === 'profile') { prefs.profile = el.value; savePrefs(); lastSig = ''; render(); }
        if (act === 'saveFolder') { await api('/api/folder', { path: $('folderInput').value }); await poll(); render(); }
        if (act === 'defaultFolder') { await api('/api/folder', { path: exeState.defaultFolder }); await poll(); render(); }
        if (act === 'openFolder') await api('/api/open');
        if (act === 'autostart') { await api('/api/autostart', { on: el.checked }); await poll(); }
        if (act === 'quit') { await api('/api/quit').catch(() => {}); document.body.innerHTML = `<div class="setup"><h1>${T('À bientôt.', 'See you.', 'Hasta pronto.')}</h1></div>`; }
        if (act === 'reanalyze') { if (mode === 'exe') { await api('/api/reanalyze'); await poll(); } else { for (const m of Object.values(matches)) m.v = 0; await kv('matches', matches); scan(); } }
        if (act === 'welcomed') { prefs.welcomed = true; prefs.seenVersion = exeState?.version; savePrefs(); render(); }
        if (act === 'seen') { prefs.seenVersion = exeState?.version; savePrefs(); render(); }
        if (act === 'install') { await api('/api/update', { action: 'install' }); await poll(); }
        if (act === 'checkUpdate') { await api('/api/update', { action: 'check' }); lastSig = ''; await poll(); }
        if (act === 'ovToggle') { await api('/api/overlay', { action: 'toggle' }); setTimeout(poll, 300); }
        if (act === 'ovLock') { await api('/api/overlay', { action: 'lock' }); setTimeout(poll, 300); }
        if (act === 'openData') await api('/api/open', { what: 'data' });
        if (act === 'uninstall' && confirm(T("Désinstaller Coffres ? Le lancement avec Windows est retiré, tes données de Coffres et l'exe sont supprimés. Tes replays ne sont pas touchés.", 'Uninstall Coffres? Start with Windows is removed, your Coffres data and the exe are deleted. Your replays are not touched.', '¿Desinstalar Coffres? Se quita el inicio con Windows y se borran tus datos de Coffres y el exe. Tus repeticiones no se tocan.'))) { await api('/api/uninstall').catch(() => {}); document.body.innerHTML = `<div class="setup"><h1>${T('Coffres est désinstallé.', 'Coffres is uninstalled.', 'Coffres está desinstalado.')}</h1></div>`; }
        if (act === 'export') {
          const blob = new Blob([JSON.stringify({ app: 'coffres', prefs, manual, collection, matches: mode === 'web' ? matches : undefined }, null, 1)], { type: 'application/json' });
          const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `coffres-${dayKey(Date.now())}.json` }); a.click();
        }
        if (act === 'import') {
          const d = JSON.parse(await el.files[0].text()); if (d.app !== 'coffres') throw new Error('format');
          Object.assign(prefs, d.prefs); manual = d.manual || []; collection = d.collection || {};
          savePrefs(); store.set('manual', manual); store.set('collection', collection);
          if (mode === 'web' && d.matches) { matches = { ...d.matches, ...matches }; await kv('matches', matches); }
          lastSig = ''; render();
        }
        if (act === 'wipe' && confirm(T('Tout effacer ? Les replays ne sont pas touchés, ils seront relus.', 'Erase everything? Replays are not touched, they will be read again.', '¿Borrar todo? Las repeticiones no se tocan, se volverán a leer.'))) {
          localStorage.clear(); const db = await idb; db.close(); indexedDB.deleteDatabase('coffres'); location.reload();
        }
      } catch (e) { alert(e.message); }
    };
    if (el.tagName === 'INPUT' || el.tagName === 'SELECT') el.onchange = run; else el.onclick = run;
  });
  const rw = $('resumeWrap');
  if (rw && savedDir) {
    rw.innerHTML = `<p style="margin-top:14px"><button class="btn ghost" id="resumeBtn">${T('Reprendre avec', 'Resume with', 'Seguir con')} « ${esc(savedDir.name)} »</button></p>`;
    $('resumeBtn').onclick = async () => { if (await savedDir.requestPermission({ mode: 'read' }) === 'granted') { dir = savedDir; go('accueil'); scan(); } };
  }
}

// ---------------- boot ----------------
const params = new URLSearchParams(location.search);
const obsOpts = { style: params.get('style') || 'hud', size: Number(params.get('size') || 1), opacity: Number(params.get('opacity') || 1), squad: params.get('squad') === '1' };
if (params.get('lang')) prefs.lang = params.get('lang');
if (params.get('obs')) document.body.classList.add('obs');
page = PAGES.some(([k]) => k === location.hash.slice(1)) ? location.hash.slice(1) : 'accueil';
let savedDir = null, loadedVersion = null;

fetch(CONTENT_URL, { cache: 'no-cache' }).then((r) => r.json()).then((c) => { content = c; lastSig = ''; update(); }).catch(() => {});

const probe = await fetch('/api/state', { cache: 'no-store' }).then((r) => r.ok ? r.json() : null).catch(() => null);
if (probe?.mode === 'exe') {
  mode = 'exe'; exeState = probe; matches = probe.matches; live = probe.live; qDone = probe.done; qTotal = probe.total; loadedVersion = probe.version;
  const u = probe.user || {};
  if (u.prefs) { Object.assign(prefs, u.prefs); prefs.overlay = { style: 'hud', size: 1, opacity: 1, squad: false, native: true, onlyGame: true, ...u.prefs.overlay }; manual = u.manual || []; collection = u.collection || {}; dismissed = u.dismissed || []; }
  else pushUser();
  setInterval(poll, params.get('obs') ? 5000 : 3000);
} else {
  matches = (await kv('matches')) || {};
  savedDir = await kv('dir');
  if (savedDir && await savedDir.queryPermission({ mode: 'read' }) === 'granted') dir = savedDir;
  setInterval(scan, 5000);
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && scan());
  scan();
}
render();
update();
setInterval(() => { lastSig = ''; update(); }, 60000);
</script>
</body>
